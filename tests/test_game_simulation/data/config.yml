## Combined config for ctf01d
# use 2 spaces for tab

game:
  id: "test" # uniq gameid must be regexp [a-z0-9]+
  name: "Test First Game" # visible game name in scoreboard
  start_utc: "2025-11-12 16:00:00" # start time of game (UTC)
  end_utc: "2030-11-12 22:00:00" # end time of game (UTC)
  coffee_break_start: "2025-11-12 20:00:00" # start time of game coffee break (UTC), but it will be ignored if period more (or less) then start and end
  coffee_break_end: "2025-11-12 21:00:00" # end time of game coffee break (UTC), but it will be ignored if period more (or less) then start and end
  flag_lifetime_in_seconds: 60 # you can change flag time live (in minutes)
  flag_cost_in_points: 10 # basic costs stolen (attack) flag in points for adaptive scoreboard

scoreboard:
  port: 8080 # http port for scoreboard
  htmlfolder: "./html" # web page for scoreboard see index-template.html
  random: no # If yes - will be random values in scoreboard

checkers:
  - id: "service1_py" # work directory will be checker_example_service4
    service_name: "Python"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 5 # max time for running script
    round_in_seconds: 15 # like a round for service
  - id: "service2_go"
    service_name: "Golang"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 5
    round_in_seconds: 15
  - id: "service3_php"
    service_name: "PHP"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 5
    round_in_seconds: 15
  - id: "service4_cpp" # work directory will be checker_example_service4
    service_name: "C++"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 5
    round_in_seconds: 15

teams:
  - id: "team1"
    name: "Team 1"
    active: yes
    logo: "./html/images/teams0/team1.png"
    ip_address: "10.10.11.1" # address to vulnserver
  - id: "team2"
    name: "Team 2"
    active: yes
    logo: "./html/images/teams0/team2.png"
    ip_address: "10.10.12.1" # address to vulnserver
  - id: "team3"
    name: "Team 3"
    active: yes
    logo: "./html/images/teams0/team3.png"
    ip_address: "10.10.13.1" # address to vulnserver
