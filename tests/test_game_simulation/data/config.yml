## Combined config for ctf01d
# use 2 spaces for tab

game:
  id: "test"
  name: "Test First Game"
  start-utc: "2025-11-12 16:00:00"
  end-utc: "2030-11-12 22:00:00"
  coffee-break:
    start-utc: "2025-11-12 20:00:00"
    end-utc: "2025-11-12 21:00:00"
  flag-lifetime-in-seconds: 60
  flag-cost-in-points: 100

scoreboard:
  port: 8080
  html-dir-path: "./html" # web page for scoreboard see index-template.html
  random: no # If yes - will be random values in scoreboard
  prometheus-metrics-endpoint:
    enabled: yes
    allowed-for: "10.10.100.*, 127.0.*"

services:
  - id: "service1_py"
    name: "Python 1"
    enabled: yes
    logo: "./html/images/services/service1-default-icon.svg"
    logo-big: "./html/images/services/service1-default-icon.svg"
    script-relative-path: "./checker.py"
    script-timeout-in-seconds: 5 # max time for running script
    round-in-seconds: 15 # like a round for service
  - id: "service2_py"
    name: "Python 2"
    enabled: yes
    logo: "./html/images/services/service2-default-icon.svg"
    logo-big: "./html/images/services/service2-default-icon.svg"
    script-relative-path: "./checker.py"
    script-timeout-in-seconds: 5
    round-in-seconds: 15
  - id: "service3_py"
    name: "Python 3"
    enabled: yes
    logo: "./html/images/services/service3-default-icon.svg"
    logo-big: "./html/images/services/service3-default-icon.svg"
    script-relative-path: "./checker.py"
    script-timeout-in-seconds: 5
    round-in-seconds: 15
  - id: "service4_py"
    name: "Python 4"
    enabled: yes
    logo: "./html/images/services/service4-default-icon.svg"
    logo-big: "./html/images/services/service4-default-icon.svg"
    script-relative-path: "./checker.py"
    script-timeout-in-seconds: 5
    round-in-seconds: 15

teams:
  config:
    ip-or-host-prefix: ""
    ip-or-host-suffix: ""
  list:
    - id: "team1"
      type: normal
      name: "Team 1"
      active: yes
      logo: "./html/images/teams/team01.png"
      logo-big: "./html/images/teams/team01.png"
      ip-or-host: "10.10.11.1" # address to vulnserver
    - id: "team2"
      type: normal
      name: "Team 2"
      active: yes
      logo: "./html/images/teams/team02.png"
      logo-big: "./html/images/teams/team02.png"
      ip-or-host: "10.10.12.1" # address to vulnserver
    - id: "team3"
      type: normal
      name: "Team 3"
      active: yes
      logo: "./html/images/teams/team03.png"
      logo-big: "./html/images/teams/team03.png"
      ip-or-host: "10.10.13.1" # address to vulnserver
