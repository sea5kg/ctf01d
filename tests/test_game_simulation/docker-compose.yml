services:

  # service 1 - port 4101
  team1_service1_server:
    build: ./vulnbox/service1_py/
    image: ctf01d-game-simulation/service1_py:latest
    volumes:
      - "./tmp/team1_service1_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team1_net

  team2_service1_server:
    image: ctf01d-game-simulation/service1_py:latest
    volumes:
      - "./tmp/team2_service1_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team2_net

  team3_service1_server:
    image: ctf01d-game-simulation/service1_py:latest
    volumes:
      - "./tmp/team3_service1_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team3_net

  # service 2 - port 4102
  team1_service2_server:
    build: ./vulnbox/service2_py/
    image: ctf01d-game-simulation/service2_py:latest
    volumes:
      - "./tmp/team1_service2_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team1_net

  team2_service2_server:
    image: ctf01d-game-simulation/service2_py:latest
    volumes:
      - "./tmp/team2_service2_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team2_net

  team3_service2_server:
    image: ctf01d-game-simulation/service2_py:latest
    volumes:
      - "./tmp/team3_service2_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team3_net

  # service 3 - port 4103
  team1_service3_server:
    build: ./vulnbox/service3_py/
    image: ctf01d-game-simulation/service3_py:latest
    volumes:
      - "./tmp/team1_service3_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team1_net

  team2_service3_server:
    image: ctf01d-game-simulation/service3_py:latest
    volumes:
      - "./tmp/team2_service3_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team2_net

  team3_service3_server:
    image: ctf01d-game-simulation/service3_py:latest
    volumes:
      - "./tmp/team3_service3_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team3_net

  # service 4 - port 4104
  team1_service4_server:
    build: ./vulnbox/service4_py/
    image: ctf01d-game-simulation/service4_py:latest
    volumes:
      - "./tmp/team1_service4_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team1_net

  team2_service4_server:
    image: ctf01d-game-simulation/service4_py:latest
    volumes:
      - "./tmp/team2_service4_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team2_net

  team3_service4_server:
    image: ctf01d-game-simulation/service4_py:latest
    volumes:
      - "./tmp/team3_service4_py_flags:/root/flags"
    restart: always
    networks:
      - ctf01d_game_simulation_team3_net

  # team1
  team1_server:
    image: haproxy:2.0
    depends_on:
      - team1_service1_server
      - team1_service2_server
      - team1_service3_server
      - team1_service4_server
    volumes:
      - "./haproxy.configs/team1.cfg:/usr/local/etc/haproxy/haproxy.cfg"
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    restart: always
    ports:
      - "10.10.11.1:4101:4101"
      - "10.10.11.1:4102:4102"
      - "10.10.11.1:4103:4103"
      - "10.10.11.1:4104:4104"
    networks:
      - ctf01d_game_simulation_team1_net

  # team2
  team2_server:
    image: haproxy:2.0
    depends_on:
      - team2_service1_server
      - team2_service2_server
      - team2_service3_server
      - team2_service4_server
    volumes:
      - "./haproxy.configs/team2.cfg:/usr/local/etc/haproxy/haproxy.cfg"
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    restart: always
    ports:
      - "10.10.12.1:4101:4101"
      - "10.10.12.1:4102:4102"
      - "10.10.12.1:4103:4103"
      - "10.10.12.1:4104:4104"
    networks:
      - ctf01d_game_simulation_team2_net

  # team3
  team3_server:
    image: haproxy:2.0
    depends_on:
      - team3_service1_server
      - team3_service2_server
      - team3_service3_server
      - team3_service4_server
    volumes:
      - "./haproxy.configs/team3.cfg:/usr/local/etc/haproxy/haproxy.cfg"
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    restart: always
    ports:
      - "10.10.13.1:4101:4101"
      - "10.10.13.1:4102:4102"
      - "10.10.13.1:4103:4103"
      - "10.10.13.1:4104:4104"
    networks:
      - ctf01d_game_simulation_team3_net

  # jury
  ctf01d_game_simulation_jury:
    build: ../..
    image: sea5kg/ctf01d:latest
    volumes:
      - "./data:/root/data"
    ports:
      - "8080:8080"
    restart: always
    networks:
      - ctf01d_game_simulation_jury_net
      - ctf01d_game_simulation_team1_net
      - ctf01d_game_simulation_team2_net
      - ctf01d_game_simulation_team3_net

networks:
  ctf01d_game_simulation_jury_net:
    driver: bridge
    ipam:
      config:
        - subnet: "10.10.100.0/24"
          ip_range: "10.10.100.0/24"
          gateway: "10.10.100.1"
  ctf01d_game_simulation_team1_net:
    driver: bridge
    ipam:
      config:
        - subnet: "10.10.11.0/24"
          ip_range: "10.10.11.0/24"
          gateway: "10.10.11.1"
  ctf01d_game_simulation_team2_net:
    driver: bridge
    ipam:
      config:
        - subnet: "10.10.12.0/24"
          ip_range: "10.10.12.0/24"
          gateway: "10.10.12.1"
  ctf01d_game_simulation_team3_net:
    driver: bridge
    ipam:
      config:
        - subnet: "10.10.13.0/24"
          ip_range: "10.10.13.0/24"
          gateway: "10.10.13.1"
