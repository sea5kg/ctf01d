game:
  id: test
  name: Test First Game
  start_utc: '2023-11-12 16:00:00'
  end_utc: '2030-11-12 22:00:00'
  coffee_break_start: '2023-11-12 20:00:00'
  coffee_break_end: '2023-11-12 21:00:00'
  flag_lifetime_in_seconds: 60
  flag_cost_in_points: 100
scoreboard:
  port: 8080
  html-dir-path: ./html
  random: false
  prometheus-metrics-endpoint:
    enabled: no
    allowed-for: "10.10.100.*, 127.0.*"
checkers:
  - id: test_service1
    service_name: Service1
    enabled: true
    logo: "./html/images/services/service1-default-icon.svg"
    big-logo: "./html/images/services/service1-default-icon.svg"
    script-relative-path: ./checker.py
    script-timeout-in-seconds: 5
    round-in-seconds: 15
teams:
  config:
    ip-or-host-prefix: ""
    ip-or-host-suffix: ""
  list:
    - id: t01
      type: normal
      name: 'Team #1'
      active: true
      logo: ./html/images/teams/team01.png
      big-logo: ./html/images/teams/team01.png
      ip-or-host: 127.0.1.1
    - id: t02
      type: normal
      name: 'Team #2'
      active: true
      logo: ./html/images/teams/team02.png
      big-logo: ./html/images/teams/team02.png
      ip-or-host: 127.0.2.1
    - id: t03
      type: normal
      name: 'Team #3'
      active: true
      logo: ./html/images/teams/team03.png
      big-logo: ./html/images/teams/team03.png
      ip-or-host: 127.0.3.1
    - id: t04
      type: normal
      name: 'Team #4'
      active: false
      logo: ./html/images/teams/team04.png
      big-logo: ./html/images/teams/team04.png
      ip-or-host: 127.0.4.1
